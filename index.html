<!doctype html>
<html lang="tk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meydan Arena — PUBG Turnuvalary</title>
<style>
:root{--bg:#06121a;--panel:#0a1d28;--panel2:#0d2633;--gold:#ffc83d;--muted:#9ab0bf;--line:#1b3948;--green:#20bd71;--red:#ff5d63}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#102c3b,#040b10 65%);color:#edf5fa;font:15px system-ui,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;font-weight:800;background:var(--gold);color:#111}button.secondary{background:#112b39;color:#eaf4f8;border:1px solid #34505e}button.danger{background:#63232a;color:white}button.green{background:#087e4b;color:white}.wrap{max-width:1200px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0 18px;border-bottom:1px solid var(--line)}.brand{font-weight:1000;letter-spacing:.7px;color:var(--gold);font-size:20px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#b5c5ce}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button{background:transparent;color:#c6d5de;border:1px solid transparent}.nav button:hover,.nav button.active{border-color:#6d5520;color:var(--gold)}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;padding:24px 0}.heroBox,.panel,.card{background:linear-gradient(145deg,#0b202b,#06131b);border:1px solid var(--line);border-radius:15px}.heroBox{padding:30px;min-height:300px;position:relative;overflow:hidden}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:2px;font-size:12px}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.05;margin:15px 0}.hero p{color:#b7c9d3;max-width:550px}.statgrid,.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{padding:16px;background:#06151e;border:1px solid var(--line);border-radius:12px}.stat strong{display:block;color:var(--gold);font-size:24px}.section{margin:22px 0}.section h2{font-size:21px}.muted{color:var(--muted)}.card{padding:16px}.card h3{margin:4px 0 10px}.pill{display:inline-block;background:#183444;color:#cde0e9;border-radius:20px;padding:4px 9px;font-size:12px}.price{color:var(--gold);font-weight:900}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:block;color:#b8cbd5;font-size:13px;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #294451;background:#041018;color:white;outline:none}textarea{min-height:80px;resize:vertical}.field{margin:10px 0}.wide{grid-column:1/-1}.hide{display:none!important}.notice{padding:12px;border-radius:9px;background:#102d3a;color:#c4d9e4;border:1px solid #284958}.warning{color:#ffd978}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:580px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--gold)}.status{font-size:12px;font-weight:800}.ok{color:#5be5a0}.pending{color:#ffd978}.no{color:#ff8187}.footer{padding:28px 0;color:#78909c;text-align:center;border-top:1px solid var(--line);margin-top:30px}.authbox{max-width:540px;margin:35px auto;padding:24px}.bigbtn{width:100%;margin:8px 0}.adslot{border:1px dashed #47606c;padding:16px;text-align:center;color:#8099a6;border-radius:10px;margin:14px 0}.icon{font-size:27px}.mobileonly{display:none}
@media(max-width:760px){.hero{grid-template-columns:1fr}.statgrid,.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.wrap{padding:12px}.heroBox{padding:22px}.top{align-items:flex-start;flex-direction:column}.nav{width:100%}.nav button{padding:8px}.mobileonly{display:block}}
</style></head><body><div class="wrap">
<header class="top"><div class="brand">♛ MEYDAN ARENA <small>PUBG TOURNAMENTS</small></div><nav class="nav" id="nav"><button data-page="home" class="active">Baş sahypa</button><button data-page="tournaments">Ýaryşlar</button><button data-page="players">Oýunçylar</button><button data-page="ranking">Reýting</button><button data-page="news">Habarlar</button></nav><div class="row"><span id="who" class="muted">Myhman</span><button id="loginTop">Giriş / Gmail</button></div></header>
<main id="app"></main><footer class="footer">MEYDAN ARENA · Jemgyýetçilik PUBG turnuva platformasy · Bu resmi PUBG önümi däl.</footer></div>
<script>
const KEY='meydanArenaDemoV1'; let db=JSON.parse(localStorage.getItem(KEY)||'null')||{users:[],tournaments:[{id:1,title:'Hepdelik PUBG Turniri',game:'PUBG Mobile',fee:'50 TMT',prize:'1,000 TMT',date:'2026-11-01',slots:100,description:'Hepdelik açyk turnir. Öňünden hasaba ýazylyň.'}],payments:[],news:[{title:'Meydan Arena işe başlady!',body:'Täze turnirler ýakynda goşular.'}],settings:{phone:'+993 6X XXX XX XX',currency:'TMT'},current:null};let page='home';
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function current(){return db.users.find(u=>u.email===db.current)}
function admin(){return current()?.role==='admin'}function approved(){return current()?.status==='approved'}
function btn(txt,act,cls=''){return `<button class="${cls}" data-act="${act}">${txt}</button>`}
function setPage(p){page=p;render();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}
function tournamentCard(t){return `<article class="card"><div class="row"><span class="pill">${esc(t.game)}</span><span class="price">${esc(t.fee)}</span></div><h3>${esc(t.title)}</h3><p class="muted">${esc(t.description)}</p><div class="row"><span>🏆 Baýrak: <b class="price">${esc(t.prize)}</b></span><span>📅 ${esc(t.date||'Seneler soň goşular')}</span></div><p class="muted">Oýunçy çägi: ${esc(t.slots||100)}</p>${btn('Jemgyýete goşul / Töleg',`join:${t.id}`)}</article>`}
function home(){return `<section class="hero"><div class="heroBox"><div class="eyebrow">TÜRKMENISTAN · ESPORTS</div><h1>Hakyky oýunlar,<br><span style="color:var(--gold)">hakyky bäsleşikler!</span></h1><p>Meydan Arena — PUBG Mobile turnuvalary, oýunçy profilleri, reýting we jemgyýetçilik platformasy.</p><div class="row" style="justify-content:flex-start;margin-top:22px"><span>🏆 Onlaýn turnirler</span><span>♛ VIP mümkinçilik</span><span>⚡ Reýting</span></div><div style="margin-top:24px">${btn('Turnirlere goşul →',"page:tournaments")}</div></div><div class="heroBox"><div class="eyebrow">OÝUNÇY PANELI</div><h2>Salam${current()?', '+esc(current().name):''}!</h2><p class="muted">Hasabyňyzyň ýagdaýyny barlaň we täze ýaryşlara goşulyň.</p><div class="statgrid"><div class="stat"><span class="muted">Hasap</span><strong style="font-size:18px">${current()?esc(current().status==='approved'?'Tassyklandy':current().status==='rejected'?'Ret edildi':'Garaşylýar'):'Myhman'}</strong></div><div class="stat"><span class="muted">Ýaryşlar</span><strong>${current()?(current().joins||[]).length:0}</strong></div><div class="stat"><span class="muted">VIP</span><strong style="font-size:18px">${current()?.vip?'VIP':'Ýok'}</strong></div></div><div class="notice" style="margin-top:15px">Gmail arkaly girişden soň administrator hasabyňyzy tassyklaýar.</div></div></section><section class="section"><div class="row"><h2>Aktiw turnirler</h2>${btn('Ähli turnirler →','page:tournaments','secondary')}</div><div class="grid">${db.tournaments.slice(0,3).map(tournamentCard).join('')||'<p class="muted">Häzirlikçe turnir ýok.</p>'}</div></section><div class="adslot">REKLAMA ÝERI · Geljekde mahabat kody goşup bolýar</div>`}
function tournaments(){return `<section class="section"><div class="row"><h2>Turnirler</h2>${admin()?btn('+ Täze turnir','newTournament'):''}</div>${admin()?`<div id="newT" class="panel card hide"><h3>Täze turnir döret</h3><div class="fields"><div class="field"><label>Turnir ady</label><input id="tTitle"></div><div class="field"><label>Oýun</label><input id="tGame" value="PUBG Mobile"></div><div class="field"><label>Giriş tölegi</label><input id="tFee" value="50 TMT"></div><div class="field"><label>Baýrak</label><input id="tPrize" value="1000 TMT"></div><div class="field"><label>Sene</label><input id="tDate" type="date"></div><div class="field"><label>Oýunçy çägi</label><input id="tSlots" type="number" value="100"></div><div class="field wide"><label>Düşündiriş</label><textarea id="tDesc"></textarea></div></div>${btn('Sakla','saveTournament')}${btn('Ýatyr','cancelTournament','secondary')}</div>`:''}<div class="grid">${db.tournaments.map(tournamentCard).join('')||'<div class="notice">Täze turnirler soň goşular.</div>'}</div></section>`}
function auth(){return `<section class="authbox panel"><div class="eyebrow">MEYDAN ARENA</div><h2>Giriş / Hasap açmak</h2><p class="muted">Google/Gmail arkaly hasabyňyzy tassyklamak üçin önümçilik wersiýasynda Google OAuth birikdirilýär. Häzir synag görnüşi.</p><div class="notice warning">Bu deslapky demo: şu ýerde girizilen e-poçta hakyky Google girişini ýerine ýetirmeýär.</div><div class="field"><label>Adyňyz</label><input id="authName" placeholder="Oýunçy ady"></div><div class="field"><label>Gmail adresi</label><input id="authEmail" type="email" placeholder="siz@gmail.com"></div><button class="bigbtn" data-act="demoLogin">✉️ Synag giriş</button><button class="bigbtn secondary" data-act="page:home">Yza gaýt</button></section>`}
function players(){return `<section class="section"><h2>Oýunçylar</h2><div class="grid">${db.users.filter(u=>u.status==='approved').map(u=>`<div class="card"><h3>👤 ${esc(u.name)}</h3><p class="muted">${esc(u.email)}</p><span class="pill">${u.vip?'VIP':'Oýunçy'}</span></div>`).join('')||'<p class="muted">Tassyk edilen oýunçylar häzirlikçe ýok.</p>'}</div></section>`}
function ranking(){return `<section class="section"><h2>Reýting</h2><div class="panel tablewrap"><table><thead><tr><th>#</th><th>Oýunçy</th><th>Turnir</th><th>Bal</th></tr></thead><tbody>${db.users.filter(u=>u.status==='approved').map((u,i)=>`<tr><td>${i+1}</td><td>${esc(u.name)}</td><td>${(u.joins||[]).length}</td><td>${u.points||0}</td></tr>`).join('')||'<tr><td colspan="4">Reýting maglumatlary heniz ýok.</td></tr>'}</tbody></table></div></section>`}
function news(){return `<section class="section"><h2>Habarlar</h2>${admin()?`<div class="card"><label>Habar</label><input id="newsTitle" placeholder="Habar başlygy"><div class="field"><textarea id="newsBody" placeholder="Habar teksti"></textarea></div>${btn('Habar goş','addNews')}</div>`:''}<div class="grid">${db.news.map(n=>`<article class="card"><h3>${esc(n.title)}</h3><p class="muted">${esc(n.body)}</p></article>`).join('')}</div></section>`}
function payment(t){return `<section class="section panel card"><h2>Turnire goşulmak / Töleg</h2><div class="notice"><b>${esc(t.title)}</b> · Giriş: <span class="price">${esc(t.fee)}</span><p>Telefon belgisi: <b>${esc(db.settings.phone)}</b></p>Şu belgä töleg geçirip, aşakda tranzaksiýa belgini ýaz.</div><div class="field"><label>Tranzaksiýa / töleg salgysy</label><input id="payRef" placeholder="Tranzaksiýa belgisi"></div><div class="field"><label>Bellik (islege görä)</label><textarea id="payNote"></textarea></div>${btn('Tölegi barlatmak üçin iber',`submitPayment:${t.id}`,'green')}</section>`}
function dashboard(){let u=current();return `<section class="section"><h2>Şahsy panel</h2><div class="statgrid"><div class="stat">Hasap<strong style="font-size:18px">${esc(u.status)}</strong></div><div class="stat">Turnirler<strong>${(u.joins||[]).length}</strong></div><div class="stat">VIP<strong style="font-size:18px">${u.vip?'Hawa':'Ýok'}</strong></div></div><div class="card" style="margin-top:14px"><h3>Profil</h3><p>${esc(u.name)} · ${esc(u.email)}</p><p class="muted">Hasap ýagdaýy: ${esc(u.status)}</p>${btn('Çykmak','logout','secondary')}</div></section>`}
function adminPanel(){return `<section class="section"><h2>♛ Dolandyryjy paneli</h2><div class="notice warning">Admin hökmünde diňe öz hasabyňyza ygtyýar beriň. Bu demo maglumatlary diňe şu brauzerde saklaýar.</div><div class="statgrid" style="margin:15px 0"><div class="stat">Jemi ulanyjy<strong>${db.users.length}</strong></div><div class="stat">Garaşylýan<strong>${db.users.filter(u=>u.status==='pending').length}</strong></div><div class="stat">Tölegler<strong>${db.payments.length}</strong></div></div><div class="tabs">${btn('Ulanyjylar','admin:users','secondary')}${btn('Tölegler','admin:payments','secondary')}${btn('Sazlamalar','admin:settings','secondary')}</div><div id="adminContent">${adminContent||adminUsers()}</div></section>`}
let adminContent='';
function adminUsers(){return `<div class="panel tablewrap"><table><thead><tr><th>Gmail</th><th>Ady</th><th>Status</th><th>Hereket</th></tr></thead><tbody>${db.users.map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.name)}</td><td class="${u.status==='approved'?'ok':u.status==='rejected'?'no':'pending'}">${esc(u.status)}</td><td>${u.role==='admin'?'ADMIN':btn('Kabul et',`approve:${u.email}`,'green')+' '+btn('Ret et',`reject:${u.email}`,'danger')}</td></tr>`).join('')||'<tr><td colspan="4">Ulanyjy ýok</td></tr>'}</tbody></table></div>`}
function adminPayments(){return `<div class="panel tablewrap"><table><thead><tr><th>Oýunçy</th><th>Turnir</th><th>Tranzaksiýa</th><th>Status</th><th>Hereket</th></tr></thead><tbody>${db.payments.map(p=>`<tr><td>${esc(p.email)}</td><td>${esc(p.title)}</td><td>${esc(p.ref)}</td><td>${esc(p.status)}</td><td>${p.status==='pending'?btn('Tassykla',`payApprove:${p.id}`,'green')+' '+btn('Ret et',`payReject:${p.id}`,'danger'):''}</td></tr>`).join('')||'<tr><td colspan="5">Töleg ýok</td></tr>'}</tbody></table></div>`}
function adminSettings(){return `<div class="card"><h3>Töleg sazlamalary</h3><div class="field"><label>Türkmenistan telefon belgisi</label><input id="settingPhone" value="${esc(db.settings.phone)}"></div>${btn('Sakla','saveSettings')}<p class="muted">Hakyky önümçilik üçin maglumatlar ygtybarly serwerde saklanmaly.</p></div>`}
function render(){document.getElementById('who').textContent=current()?current().name+' · '+(admin()?'Admin':current().status):'Myhman';document.getElementById('loginTop').textContent=current()?'Şahsy panel':'Giriş / Gmail';document.getElementById('loginTop').dataset.act=current()?'page:dashboard':'page:auth';let html='';if(page==='home')html=home();else if(page==='tournaments')html=tournaments();else if(page==='auth')html=auth();else if(page==='players')html=players();else if(page==='ranking')html=ranking();else if(page==='news')html=news();else if(page==='dashboard')html=current()?dashboard():auth();else if(page==='payment')html=payment(db.tournaments.find(t=>t.id===Number(window.payTid))||db.tournaments[0]);else if(page==='admin')html=admin()?adminPanel():'<div class="notice">Bu bölüm diňe administrator üçin.</div>';else html=home();document.getElementById('app').innerHTML=html;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act;if(a.startsWith('page:')){setPage(a.split(':')[1]);return}if(a.startsWith('join:')){if(!current()){setPage('auth');return}if(!approved()){alert('Hasabyňyz administrator tarapyndan tassyklanmalydyr.');return}window.payTid=a.split(':')[1];setPage('payment');return}if(a==='demoLogin'){let name=document.getElementById('authName').value.trim(),email=document.getElementById('authEmail').value.trim().toLowerCase();if(!name||!email.includes('@')){alert('Adyňyzy we dogry e-poçta giriziň.');return}let u=db.users.find(x=>x.email===email);if(!u){u={name,email,status:'pending',role:'user',joins:[],points:0,vip:false};db.users.push(u)}db.current=email;save();setPage('dashboard');return}if(a==='logout'){db.current=null;save();setPage('home');return}if(a==='newTournament'){document.getElementById('newT').classList.toggle('hide');return}if(a==='cancelTournament'){setPage('tournaments');return}if(a==='saveTournament'){let title=document.getElementById('tTitle').value.trim();if(!title){alert('Turnir adyny giriziň');return}db.tournaments.unshift({id:Date.now(),title,game:document.getElementById('tGame').value,fee:document.getElementById('tFee').value,prize:document.getElementById('tPrize').value,date:document.getElementById('tDate').value,slots:document.getElementById('tSlots').value,description:document.getElementById('tDesc').value});save();setPage('tournaments');return}if(a.startsWith('submitPayment:')){if(!current()||!approved())return alert('Ilki hasabyňyz tassyklanmaly');let ref=document.getElementById('payRef').value.trim();if(!ref)return alert('Tranzaksiýa belgisini giriziň');let t=db.tournaments.find(x=>x.id===Number(a.split(':')[1]));db.payments.unshift({id:Date.now(),email:current().email,title:t.title,tid:t.id,ref,status:'pending'});current().joins.push(t.id);save();alert('Töleg barlamak üçin iberildi. Admin tassyklamagyna garaşyň.');setPage('dashboard');return}if(a.startsWith('approve:')||a.startsWith('reject:')){let [act,email]=a.split(':');let u=db.users.find(x=>x.email===email);if(u)u.status=act==='approve'?'approved':'rejected';save();adminContent=adminUsers();setPage('admin');return}if(a.startsWith('payApprove:')||a.startsWith('payReject:')){let [act,id]=a.split(':');let p=db.payments.find(x=>x.id===Number(id));if(p)p.status=act==='payApprove'?'approved':'rejected';save();adminContent=adminPayments();setPage('admin');return}if(a.startsWith('admin:')){let tab=a.split(':')[1];adminContent=tab==='users'?adminUsers():tab==='payments'?adminPayments():adminSettings();render();return}if(a==='saveSettings'){db.settings.phone=document.getElementById('settingPhone').value;save();adminContent=adminSettings();setPage('admin');return}if(a==='addNews'){let title=document.getElementById('newsTitle').value.trim(),body=document.getElementById('newsBody').value.trim();if(title){db.news.unshift({title,body});save();setPage('news')}return}});
document.querySelector('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
render();
</script></body></html>
