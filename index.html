
<!doctype html>
<html lang="tk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meydan Arena | PUBG Mobile</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0e13;color:#f5f5f5;font-family:Arial,sans-serif}
header{padding:20px;background:#151b24;border-bottom:2px solid #f5a623}
h1{color:#ffb52e;margin:0}main{max-width:850px;margin:auto;padding:18px}
.card{background:#171d27;border:1px solid #343d4b;border-radius:14px;padding:18px;margin:15px 0}
input,button{width:100%;padding:13px;margin:6px 0;border-radius:8px;border:1px solid #454f5e;font-size:16px}
input{background:#0c1118;color:white}button{background:#ffb52e;color:#171717;font-weight:bold;cursor:pointer;border:0}
.secondary{background:#303947;color:white}.muted{color:#bac2cf}.hidden{display:none}
.item{border-top:1px solid #343d4b;padding:12px 0}
#msg{white-space:pre-wrap;color:#ffcf70}
</style>
</head>
<body>
<header><h1>⚔ MEYDAN ARENA</h1><p>PUBG MOBILE • Turnuvalar • Rekabet</p></header>
<main>
<div class="card">
<h2>Hesap</h2>
<p class="muted">E-posta adresin ve şifrenle kayıt ol veya giriş yap.</p>
<input id="email" type="email" placeholder="Gmail adresin">
<input id="password" type="password" placeholder="Şifre (en az 6 karakter)">
<button onclick="signup()">Hesap oluştur</button>
<button class="secondary" onclick="login()">Giriş yap</button>
<button class="secondary" onclick="logout()">Çıkış yap</button>
<p id="msg"></p>
<p id="who" class="muted">Giriş yapılmadı.</p>
</div>

<div class="card">
<h2>🏆 Açık turnuvalar</h2>
<div id="tournaments">Turnuvalar yükleniyor…</div>
</div>

<div id="admin" class="card hidden">
<h2>🔐 Yönetici paneli</h2>
<p>Yönetici hesabıyla giriş yaptın.</p>
<input id="tname" placeholder="Turnuva adı">
<input id="tgame" value="PUBG Mobile" placeholder="Oyun">
<input id="tstart" type="datetime-local">
<input id="tfee" type="number" min="0" value="0" placeholder="Katılım ücreti">
<button onclick="addTournament()">Turnuva ekle</button>
<p class="muted">Yönetici yetkisi Supabase veritabanında kontrol edilir.</p>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hipghindmrfovryxihrj.supabase.co";
const SUPABASE_KEY = "sb_publishable_X5IUx-vRwOShD65l8B8e-A_zsy3PAbQ";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const msg = (s) => document.getElementById("msg").textContent = s;

async function signup(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  if(!email || password.length<6) return msg("E-posta gir. Şifre en az 6 karakter olmalı.");
  const {error}=await client.auth.signUp({email,password});
  if(error) return msg(error.message);
  msg("Kayıt isteği gönderildi. E-posta doğrulaması istenirse gelen kutunu kontrol et; sonra giriş yap.");
}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const {error}=await client.auth.signInWithPassword({email,password});
  if(error) return msg(error.message);
  msg("Giriş başarılı.");
  await refresh();
}

async function logout(){
  const {error}=await client.auth.signOut();
  if(error) return msg(error.message);
  msg("Çıkış yapıldı.");
  await refresh();
}

async function refresh(){
  const {data:{user}}=await client.auth.getUser();
  document.getElementById("who").textContent=user ? "Giriş: "+user.email : "Giriş yapılmadı.";
  let isAdmin=false;
  if(user){
    const {data:profile,error}=await client.from("profiles").select("role").eq("id",user.id).maybeSingle();
    if(error) msg("Profil kontrolü: "+error.message);
    isAdmin=profile?.role==="admin";
  }
  document.getElementById("admin").classList.toggle("hidden",!isAdmin);
  await loadTournaments();
}

async function loadTournaments(){
  const box=document.getElementById("tournaments");
  const {data,error}=await client.from("tournaments")
    .select("id,name,game,start_time,entry_fee,status")
    .order("created_at",{ascending:false});
  if(error){box.textContent="Turnuvalar yüklenemedi: "+error.message;return;}
  if(!data?.length){box.textContent="Henüz turnuva yok.";return;}
  box.innerHTML="";
  data.forEach(t=>{
    const div=document.createElement("div");
    div.className="item";
    const title=document.createElement("strong");
    title.textContent=t.name;
    const detail=document.createElement("p");
    detail.className="muted";
    detail.textContent=(t.game||"PUBG Mobile")+" • Ücret: "+(t.entry_fee??0)+" TMT • Durum: "+t.status+
      (t.start_time?" • Başlangıç: "+new Date(t.start_time).toLocaleString():"");
    div.append(title,detail);
    box.appendChild(div);
  });
}

async function addTournament(){
  const {data:{user}}=await client.auth.getUser();
  if(!user) return msg("Önce giriş yap.");
  const {data:profile,error:pError}=await client.from("profiles").select("role").eq("id",user.id).maybeSingle();
  if(pError || profile?.role!=="admin") return msg("Yönetici yetkisi bulunamadı.");
  const name=document.getElementById("tname").value.trim();
  const game=document.getElementById("tgame").value.trim()||"PUBG Mobile";
  const start=document.getElementById("tstart").value;
  const fee=Number(document.getElementById("tfee").value||0);
  if(!name || fee<0) return msg("Turnuva adını ve ücreti kontrol et.");
  const {error}=await client.from("tournaments").insert({
    name,game,start_time:start?new Date(start).toISOString():null,
    entry_fee:fee,status:"open"
  });
  if(error) return msg("Eklenemedi: "+error.message);
  msg("Turnuva eklendi.");
  document.getElementById("tname").value="";
  await loadTournaments();
}

client.auth.onAuthStateChange(()=>{setTimeout(()=>refresh(),0);});
refresh();
</script>
</body>
</html>
